name: Verify search visibility

on:
  push:
    branches: [main]
    paths:
      - index.html
      - robots.txt
      - sitemap.*
      - assets/**
      - images/**
      - scripts/check-seo.py
      - .github/workflows/verify-seo.yml
  pull_request:
    paths:
      - index.html
      - robots.txt
      - sitemap.*
      - assets/**
      - images/**
      - scripts/check-seo.py
      - .github/workflows/verify-seo.yml
  workflow_dispatch:
    inputs:
      verify_live:
        description: Also compare the deployed public files with this revision
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 scripts/check-seo.py
      - if: github.event_name == 'workflow_dispatch' && inputs.verify_live
        run: python3 scripts/check-seo.py --live
