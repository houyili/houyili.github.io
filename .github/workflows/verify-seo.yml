name: Verify search visibility

on:
  page_build:
  push:
    branches: [main]
    paths:
      - index.html
      - 404.html
      - _config.yml
      - robots.txt
      - sitemap.*
      - assets/**
      - images/**
      - scripts/check-seo.py
      - scripts/sync-styles.py
      - .github/workflows/verify-seo.yml
  pull_request:
    paths:
      - index.html
      - 404.html
      - _config.yml
      - robots.txt
      - sitemap.*
      - assets/**
      - images/**
      - scripts/check-seo.py
      - scripts/sync-styles.py
      - .github/workflows/verify-seo.yml
  workflow_dispatch:
    inputs:
      verify_live:
        description: Also compare the deployed public files with this revision
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name != 'page_build' || github.event.build.status == 'built'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.build.commit || github.sha }}
      - run: python3 scripts/sync-styles.py --check
      - run: python3 scripts/check-seo.py
      - if: github.event_name == 'page_build' || (github.event_name == 'workflow_dispatch' && inputs.verify_live)
        run: python3 scripts/check-seo.py --live
