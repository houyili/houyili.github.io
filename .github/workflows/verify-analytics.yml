name: Verify visitor analytics

on:
  push:
    branches: [main]
    paths:
      - index.html
      - assets/visitor-analytics.js
      - assets/appearance.js
      - tests/**
      - scripts/check-analytics.mjs
      - .github/workflows/verify-analytics.yml
  pull_request:
    paths:
      - index.html
      - assets/visitor-analytics.js
      - assets/appearance.js
      - tests/**
      - scripts/check-analytics.mjs
      - .github/workflows/verify-analytics.yml
  workflow_dispatch:
    inputs:
      verify_live:
        description: Also verify that the deployed public files match this revision
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          package-manager-cache: false
      - run: node --test tests/*.test.mjs
      - run: node scripts/check-analytics.mjs
      - if: github.event_name == 'workflow_dispatch' && inputs.verify_live
        run: node scripts/check-analytics.mjs --live
